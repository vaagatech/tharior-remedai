apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: remedai-bff-scaler
  namespace: remedai
  labels:
    app.kubernetes.io/name: remedai-bff
    app.kubernetes.io/component: bff-scaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: remedai-bff
  minReplicaCount: 1 # Scale down to 1 when idle
  maxReplicaCount: 10
  cooldownPeriod: 180
  pollingInterval: 15
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: remedai-scheduler-scaler
  namespace: remedai
  labels:
    app.kubernetes.io/name: remedai-scheduler
    app.kubernetes.io/component: scheduler-scaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: remedai-scheduler
  minReplicaCount: 1 # Scale down to 1 when idle
  maxReplicaCount: 5
  cooldownPeriod: 300
  pollingInterval: 30
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "75"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"
    - type: cron
      metadata:
        timezone: "UTC"
        start: "0 0 * * 0" # Weekly on Sunday 00:00 UTC
        end: "0 2 * * 0"
        desiredReplicas: "2"
