{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.scheduler.name | default "remedai-scheduler" | quote }}
  namespace: {{ .Values.global.namespace | default "remedai" | quote }}
  labels:
    app: {{ .Values.scheduler.name | default "remedai-scheduler" | quote }}
    app.kubernetes.io/name: {{ .Values.scheduler.name | default "remedai-scheduler" | quote }}
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: remedai-platform
spec:
  replicas: {{ .Values.scheduler.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ .Values.scheduler.name | default "remedai-scheduler" | quote }}
  template:
    metadata:
      labels:
        app: {{ .Values.scheduler.name | default "remedai-scheduler" | quote }}
        app.kubernetes.io/name: {{ .Values.scheduler.name | default "remedai-scheduler" | quote }}
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/part-of: remedai-platform
    spec:
      terminationGracePeriodSeconds: {{ .Values.global.spotResilience.terminationGracePeriodSeconds | default 25 }}

      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default "remedai-sa" | quote }}
      {{- end }}

      {{- if .Values.global.spotResilience.preferSpotNodes }}
      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Exists"
          effect: "NoSchedule"

      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: cloud.google.com/gke-spot
                    operator: In
                    values:
                      - "true"
      {{- end }}

      containers:
        - name: scheduler
          image: {{ .Values.global.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" | quote }}
          command: ["python", "-c", "import asyncio, logging; from app.services.llm_pricing_service import llm_pricing_service; logging.basicConfig(level=logging.INFO); logging.info('Starting Remedai Scheduler...'); asyncio.run(llm_pricing_service.start_weekly_scheduler_loop())"]
          resources:
            requests:
              cpu: {{ .Values.scheduler.resources.requests.cpu | default "100m" | quote }}
              memory: {{ .Values.scheduler.resources.requests.memory | default "128Mi" | quote }}
            limits:
              cpu: {{ .Values.scheduler.resources.limits.cpu | default "500m" | quote }}
              memory: {{ .Values.scheduler.resources.limits.memory | default "256Mi" | quote }}
          envFrom:
            - configMapRef:
                name: remedai-config
          {{- if .Values.scheduler.env }}
          env:
            {{- toYaml .Values.scheduler.env | nindent 12 }}
          {{- end }}
{{- end }}
