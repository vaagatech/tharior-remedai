{{- if and .Values.bff.enabled .Values.bff.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ printf "%s-scaler" (.Values.bff.name | default "remedai-bff") | quote }}
  namespace: {{ .Values.global.namespace | default "remedai" | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.bff.name | default "remedai-bff" | quote }}
    app.kubernetes.io/component: bff-scaler
    app.kubernetes.io/part-of: remedai-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.bff.name | default "remedai-bff" | quote }}
  minReplicaCount: {{ .Values.bff.keda.minReplicaCount | default 1 }}
  maxReplicaCount: {{ .Values.bff.keda.maxReplicaCount | default 10 }}
  pollingInterval: {{ .Values.bff.keda.pollingInterval | default 15 }}
  cooldownPeriod: {{ .Values.bff.keda.cooldownPeriod | default 180 }}
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  {{- if .Values.bff.keda.triggers }}
  triggers:
    {{- toYaml .Values.bff.keda.triggers | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if and .Values.scheduler.enabled .Values.scheduler.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ printf "%s-scaler" (.Values.scheduler.name | default "remedai-scheduler") | quote }}
  namespace: {{ .Values.global.namespace | default "remedai" | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.scheduler.name | default "remedai-scheduler" | quote }}
    app.kubernetes.io/component: scheduler-scaler
    app.kubernetes.io/part-of: remedai-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.scheduler.name | default "remedai-scheduler" | quote }}
  minReplicaCount: {{ .Values.scheduler.keda.minReplicaCount | default 1 }}
  maxReplicaCount: {{ .Values.scheduler.keda.maxReplicaCount | default 5 }}
  pollingInterval: {{ .Values.scheduler.keda.pollingInterval | default 30 }}
  cooldownPeriod: {{ .Values.scheduler.keda.cooldownPeriod | default 300 }}
  advanced:
    restoreToOriginalReplicaCount: true
  {{- if .Values.scheduler.keda.triggers }}
  triggers:
    {{- toYaml .Values.scheduler.keda.triggers | nindent 4 }}
  {{- end }}
{{- end }}
