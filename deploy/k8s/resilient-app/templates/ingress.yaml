{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-ingress" (.Values.bff.name | default "remedai-bff") | quote }}
  namespace: {{ .Values.global.namespace | default "remedai" | quote }}
  labels:
    app.kubernetes.io/name: remedai-ingress
    app.kubernetes.io/part-of: remedai-platform
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | default "gce" | quote }}
    kubernetes.io/ingress.allow-http: "true"
    {{- if .Values.ingress.staticIpName }}
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.ingress.staticIpName | quote }}
    {{- end }}
    {{- if .Values.ingress.annotations }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "gce" | quote }}
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.path | default "/" | quote }}
            pathType: {{ .Values.ingress.pathType | default "Prefix" | quote }}
            backend:
              service:
                name: {{ .Values.bff.name | default "remedai-bff" | quote }}
                port:
                  number: {{ .Values.bff.servicePort | default 80 }}
{{- end }}
