apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: remedai-agent-worker
  namespace: remedai
  labels:
    app.kubernetes.io/name: remedai-agent-worker
    app.kubernetes.io/component: agent-worker
spec:
  jobTargetRef:
    parallelism: 1
    completions: 1
    activeDeadlineSeconds: 1800
    backoffLimit: 2
    template:
      metadata:
        labels:
          app: remedai-agent-worker
          app.kubernetes.io/name: remedai-agent-worker
          app.kubernetes.io/component: agent-worker
      spec:
        restartPolicy: Never
        terminationGracePeriodSeconds: 25
        serviceAccountName: remedai-sa
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: cloud.google.com/gke-spot
                      operator: In
                      values:
                        - "true"
        containers:
          - name: agent-worker
            image: remedai-api:latest
            imagePullPolicy: IfNotPresent
            command: ["python", "-c", "import asyncio, logging; from app.core.keda_operator import keda_operator; logging.basicConfig(level=logging.INFO); logging.info('Remedai Isolated Agent Worker Started'); asyncio.run(asyncio.sleep(1))"]
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 512Mi
            envFrom:
              - configMapRef:
                  name: remedai-config
            env:
              - name: SERVICE_ROLE
                value: "agent_worker"
              - name: IS_ISOLATED_POD
                value: "true"
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: MAX_MEMORY_MB
                value: "300"
              - name: GC_RESERVE_RATIO
                value: "0.25"
              - name: BASE_SANDBOX_DIR
                value: "/tmp/sandboxes"
            volumeMounts:
              - name: sandbox-ephemeral-storage
                mountPath: /tmp/sandboxes
        volumes:
          - name: sandbox-ephemeral-storage
            emptyDir:
              medium: ""
              sizeLimit: "2Gi"
  pollingInterval: 5
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  maxReplicaCount: 50
  triggers:
    - type: redis
      metadata:
        address: redis-queue.remedai.svc.cluster.local:6379
        listName: remedai_agentic_tasks
        listLength: "1"
