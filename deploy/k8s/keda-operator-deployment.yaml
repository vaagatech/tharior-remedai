# ==============================================================================
# KEDA v2.14 Operator & Metrics Server Deployment
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-operator
  namespace: keda
  labels:
    app.kubernetes.io/name: keda-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keda-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keda-operator
    spec:
      serviceAccountName: keda-operator
      containers:
        - name: keda-operator
          image: ghcr.io/kedacore/keda:2.14.0
          command:
            - /keda
          args:
            - --leader-elect
            - --zap-log-level=info
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: WATCH_NAMESPACE
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-metrics-apiserver
  namespace: keda
  labels:
    app.kubernetes.io/name: keda-metrics-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keda-metrics-apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keda-metrics-apiserver
    spec:
      serviceAccountName: keda-operator
      containers:
        - name: keda-metrics-apiserver
          image: ghcr.io/kedacore/keda-metrics-apiserver:2.14.0
          command:
            - /keda-adapter
          args:
            - --secure-port=6443
            - --logtostderr=true
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          ports:
            - containerPort: 6443
              name: https
