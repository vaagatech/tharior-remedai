apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remediationbranches.tharior.ai
spec:
  group: tharior.ai
  names:
    kind: RemediationBranch
    listKind: RemediationBranchList
    plural: remediationbranches
    singular: remediationbranch
    shortNames:
      - rbr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                repoName:
                  type: string
                ticketId:
                  type: string
                branchName:
                  type: string
                baseBranch:
                  type: string
                  default: "main"
                tenantId:
                  type: string
            status:
              type: object
              properties:
                state:
                  type: string
                  enum: ["CREATED", "PATCHED", "PR_OPENED", "MERGED", "CONFLICT_DETECTED", "PRUNED"]
                prUrl:
                  type: string
                headSha:
                  type: string
      subresources:
        status: {}
