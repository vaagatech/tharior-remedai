name: Deploy UI to AWS (S3 + CloudFront)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web-desk/**'
      - 'deploy/terraform-aws/**'
      - '.github/workflows/deploy-ui-aws.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      api_base_url:
        description: 'Override API Base URL (optional - defaults to GCP API Gateway output)'
        required: false
        default: ''

jobs:
  provision-and-deploy-ui:
    name: Provision AWS Infra & Deploy Web Desk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.0'

      # Step 1: Provision / Refresh AWS Cognito, S3 & CloudFront with Persistent S3 Backend
      - name: Provision AWS S3, CloudFront & Cognito via Terraform
        id: tf_aws
        run: |
          cd deploy/terraform-aws
          
          ENV_NAME="${{ github.event.inputs.environment || 'dev' }}"
          AWS_REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="remedai-terraform-state-${ACCOUNT_ID}"
          STATE_KEY="remedai/${ENV_NAME}/ui.tfstate"
          BUCKET_NAME="remedai-${ENV_NAME}-ui-${ACCOUNT_ID}"
          OAC_NAME="remedai-${ENV_NAME}-oac-${ACCOUNT_ID}"
          POOL_NAME="remedai-${ENV_NAME}-user-pool"

          echo "Ensuring S3 Remote State Bucket exists: $STATE_BUCKET"
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

          echo "Initializing Terraform with S3 backend: s3://${STATE_BUCKET}/${STATE_KEY}"
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

          # Safe discovery & one-time import for existing AWS resources if state is empty
          TF_RESOURCES=$(terraform state list 2>/dev/null || echo "")

          if ! echo "$TF_RESOURCES" | grep -q "aws_s3_bucket.ui_bucket"; then
            echo "Importing existing S3 bucket $BUCKET_NAME into state..."
            terraform import -var="environment=$ENV_NAME" aws_s3_bucket.ui_bucket "$BUCKET_NAME" 2>/dev/null || true
            terraform import -var="environment=$ENV_NAME" aws_s3_bucket_public_access_block.ui_bucket_block "$BUCKET_NAME" 2>/dev/null || true
          fi

          if ! echo "$TF_RESOURCES" | grep -q "aws_cloudfront_origin_access_control.oac"; then
            OAC_ID=$(aws cloudfront list-origin-access-controls --query "OriginAccessControlList.Items[?Name=='$OAC_NAME'].Id" --output text 2>/dev/null || echo "")
            if [ -n "$OAC_ID" ] && [ "$OAC_ID" != "None" ]; then
              echo "Importing existing OAC $OAC_ID into state..."
              terraform import -var="environment=$ENV_NAME" aws_cloudfront_origin_access_control.oac "$OAC_ID" 2>/dev/null || true
            fi
          fi

          if ! echo "$TF_RESOURCES" | grep -q "aws_cognito_user_pool.pool"; then
            POOL_ID=$(aws cognito-idp list-user-pools --max-results 20 --query "UserPools[?Name=='$POOL_NAME'].Id" --output text 2>/dev/null || echo "")
            if [ -n "$POOL_ID" ] && [ "$POOL_ID" != "None" ]; then
              echo "Importing existing Cognito Pool $POOL_ID into state..."
              terraform import -var="environment=$ENV_NAME" aws_cognito_user_pool.pool "$POOL_ID" 2>/dev/null || true
            fi
          fi

          if ! echo "$TF_RESOURCES" | grep -q "aws_cloudfront_distribution.ui_distribution"; then
            DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='remedai ${ENV_NAME} Web Desk CDN'].Id" --output text 2>/dev/null || echo "")
            if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
              echo "Importing existing CloudFront Distribution $DIST_ID into state to lock URL..."
              terraform import -var="environment=$ENV_NAME" aws_cloudfront_distribution.ui_distribution "$DIST_ID" 2>/dev/null || true
            fi
          fi

          terraform apply -auto-approve -var="environment=$ENV_NAME"

          # Export outputs dynamically for downstream build steps
          COGNITO_USER_POOL_ID=$(terraform output -raw cognito_user_pool_id)
          COGNITO_CLIENT_ID=$(terraform output -raw cognito_client_id)
          AWS_S3_BUCKET_NAME=$(terraform output -raw s3_bucket_name)
          CLOUDFRONT_DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
          CLOUDFRONT_URL=$(terraform output -raw cloudfront_domain_name)

          echo "COGNITO_USER_POOL_ID=$COGNITO_USER_POOL_ID" >> $GITHUB_ENV
          echo "COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID" >> $GITHUB_ENV
          echo "AWS_S3_BUCKET_NAME=$AWS_S3_BUCKET_NAME" >> $GITHUB_ENV
          echo "CLOUDFRONT_DISTRIBUTION_ID=$CLOUDFRONT_DISTRIBUTION_ID" >> $GITHUB_ENV
          echo "CLOUDFRONT_URL=$CLOUDFRONT_URL" >> $GITHUB_ENV
          echo "STATE_BUCKET=$STATE_BUCKET" >> $GITHUB_ENV

      # Step 2: Resolve GCP API Gateway Endpoint & Write Central S3 Manifest
      - name: Resolve API Gateway & Persist Deployment Variables to S3
        id: resolve_api
        run: |
          ENV_NAME="${{ github.event.inputs.environment || 'dev' }}"
          AWS_REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          
          # Try reading existing manifest from central S3 state bucket
          EXISTING_API_URL=""
          if aws s3 cp "s3://${STATE_BUCKET}/config/${ENV_NAME}/manifest.json" /tmp/existing_manifest.json 2>/dev/null; then
            EXISTING_API_URL=$(jq -r '.GCP_API_GATEWAY_URL // empty' /tmp/existing_manifest.json 2>/dev/null || echo "")
          fi

          if [ -n "${{ github.event.inputs.api_base_url }}" ]; then
            API_URL="${{ github.event.inputs.api_base_url }}"
          elif [ -n "$EXISTING_API_URL" ]; then
            API_URL="$EXISTING_API_URL"
          elif [ -n "${{ secrets.VITE_API_BASE_URL }}" ]; then
            API_URL="${{ secrets.VITE_API_BASE_URL }}"
          else
            API_URL="https://dev-api-gw.gateway.dev"
          fi
          echo "VITE_API_BASE_URL=$API_URL" >> $GITHUB_ENV

          # Construct central persistent manifest
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat <<EOF > /tmp/manifest.json
          {
            "ENVIRONMENT": "$ENV_NAME",
            "AWS_REGION": "$AWS_REGION",
            "STATE_BUCKET": "$STATE_BUCKET",
            "AWS_S3_BUCKET_NAME": "$AWS_S3_BUCKET_NAME",
            "CLOUDFRONT_DISTRIBUTION_ID": "$CLOUDFRONT_DISTRIBUTION_ID",
            "CLOUDFRONT_URL": "$CLOUDFRONT_URL",
            "COGNITO_USER_POOL_ID": "$COGNITO_USER_POOL_ID",
            "COGNITO_CLIENT_ID": "$COGNITO_CLIENT_ID",
            "GCP_API_GATEWAY_URL": "$API_URL",
            "LAST_DEPLOYED_TIMESTAMP": "$TIMESTAMP"
          }
          EOF

          echo "Persisting central deployment manifest to S3:"
          cat /tmp/manifest.json

          aws s3 cp /tmp/manifest.json "s3://${STATE_BUCKET}/config/${ENV_NAME}/manifest.json"
          aws s3 cp /tmp/manifest.json "s3://${AWS_S3_BUCKET_NAME}/env-config.json"

      # Step 3: Build React Web Desk with Injected Auth & API Configuration
      - name: Install Dependencies & Build Web Desk
        run: |
          echo "Building Web Desk SPA with persistent environment variables:"
          echo " - API Base URL:      $VITE_API_BASE_URL"
          echo " - Cognito Pool ID:   $COGNITO_USER_POOL_ID"
          echo " - Cognito Client ID: $COGNITO_CLIENT_ID"
          echo " - Target S3 Bucket:  $AWS_S3_BUCKET_NAME"
          echo " - CloudFront Domain: $CLOUDFRONT_URL"

          npm install --no-audit
          npm install --no-save --workspace=@tharior/web-desk @tailwindcss/oxide-linux-x64-gnu @tailwindcss/node lightningcss-linux-x64-gnu @rolldown/binding-linux-x64-gnu || true

          VITE_API_BASE_URL="$VITE_API_BASE_URL" \
          VITE_COGNITO_USER_POOL_ID="$COGNITO_USER_POOL_ID" \
          VITE_COGNITO_CLIENT_ID="$COGNITO_CLIENT_ID" \
          VITE_AWS_REGION="${{ secrets.AWS_REGION || 'us-east-1' }}" \
          npm run build --workspace=@tharior/web-desk

      # Step 4: Sync Built Assets to S3 Static Hosting Bucket
      - name: Sync Static Assets to AWS S3
        run: |
          echo "Syncing built assets to s3://$AWS_S3_BUCKET_NAME..."
          aws s3 sync apps/web-desk/dist/ "s3://$AWS_S3_BUCKET_NAME" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "env-config.json"

          # Upload index.html and env-config.json with zero cache for instant SPA updates
          aws s3 cp apps/web-desk/dist/index.html "s3://$AWS_S3_BUCKET_NAME/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      # Step 5: Invalidate CloudFront CDN Cache
      - name: Invalidate AWS CloudFront Cache
        run: |
          echo "Invalidating CloudFront Cache for Distribution: $CLOUDFRONT_DISTRIBUTION_ID"
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
          echo "Deployment Complete! Web Desk live permanently at: $CLOUDFRONT_URL"
