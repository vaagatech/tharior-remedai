name: Deploy Backend to GKE

on:
  push:
    branches: [main]
    paths:
      - 'apps/api-gateway/**'
      - 'packages/**'
      - 'app-config.yaml'
      - 'deploy/**'
      - '.github/workflows/deploy-backend-gke.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  build-and-deploy:
    name: Build Container & Deploy to GKE
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      # Dynamically extract GCP Project ID, Region, and GKE Cluster Name
      - name: Resolve GCP & GKE Dynamic Parameters
        id: resolve_gcp
        run: |
          PROJECT_ID="${{ steps.gcp_auth.outputs.project_id }}"
          if [ -z "$PROJECT_ID" ]; then
            PROJECT_ID="$(gcloud config get-value project)"
          fi

          REGION="${{ secrets.GCP_REGION || 'us-central1' }}"
          CLUSTER_NAME="${{ secrets.GKE_CLUSTER_NAME || 'dev-spot-cluster' }}"
          REGISTRY_REPO="${{ secrets.ARTIFACT_REGISTRY_REPO || 'dev-gke-apps' }}"

          # Auto-detect or ensure Artifact Registry repo exists
          if ! gcloud artifacts repositories describe "$REGISTRY_REPO" --location="$REGION" --project="$PROJECT_ID" >/dev/null 2>&1; then
            EXISTING_REPO=$(gcloud artifacts repositories list --location="$REGION" --project="$PROJECT_ID" --format="value(name)" 2>/dev/null | head -n 1 | awk -F'/' '{print $NF}')
            if [ -n "$EXISTING_REPO" ]; then
              echo "Detected existing Artifact Registry repository: $EXISTING_REPO"
              REGISTRY_REPO="$EXISTING_REPO"
            else
              echo "Creating Artifact Registry repository: $REGISTRY_REPO"
              gcloud artifacts repositories create "$REGISTRY_REPO" \
                --repository-format=docker \
                --location="$REGION" \
                --project="$PROJECT_ID" \
                --description="Docker repository for Remedai agent engine" --quiet || true
            fi
          fi

          # Auto-detect GKE Cluster name if default not matched
          if ! gcloud container clusters describe "$CLUSTER_NAME" --region="$REGION" --project="$PROJECT_ID" >/dev/null 2>&1; then
            EXISTING_CLUSTER=$(gcloud container clusters list --project="$PROJECT_ID" --format="value(name)" 2>/dev/null | head -n 1)
            if [ -n "$EXISTING_CLUSTER" ]; then
              echo "Detected existing GKE Cluster: $EXISTING_CLUSTER"
              CLUSTER_NAME="$EXISTING_CLUSTER"
            fi
          fi

          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "REGION=$REGION" >> $GITHUB_ENV
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV
          echo "REGISTRY_REPO=$REGISTRY_REPO" >> $GITHUB_ENV

          echo "Deploying with dynamically resolved parameters:"
          echo " - Project ID: $PROJECT_ID"
          echo " - Region:     $REGION"
          echo " - GKE Cluster:$CLUSTER_NAME"
          echo " - Registry:   $REGISTRY_REPO"

      - name: Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and Push Docker Image
        id: docker_build
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$REGISTRY_REPO/remedai-api:${{ github.sha }}"
          LATEST_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$REGISTRY_REPO/remedai-api:latest"

          echo "Building multi-stage container image: $IMAGE_URI"
          docker build \
            -t "$IMAGE_URI" \
            -t "$LATEST_URI" \
            apps/api-gateway

          echo "Pushing image to Google Artifact Registry..."
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Connect to GKE Cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Deploy to GKE via Resilient Helm Template
        run: |
          if [ -d "deploy/k8s/resilient-app" ]; then
            CHART_PATH="deploy/k8s/resilient-app"
          else
            git clone --depth 1 https://github.com/${{ github.repository_owner }}/gke-deployment.git /tmp/gke-infra
            CHART_PATH="/tmp/gke-infra/templates/resilient-app"
          fi

          echo "Deploying remedai-api with Spot resilience and KEDA autoscaling..."
          # Clean up any stuck/failed previous release revisions
          if helm status remedai-api --namespace remedai >/dev/null 2>&1; then
            RELEASE_STATUS=$(helm status remedai-api --namespace remedai -o json 2>/dev/null | grep -o '"status":"[^"]*' | cut -d'"' -f4 || echo "")
            if [ "$RELEASE_STATUS" = "failed" ] || [ "$RELEASE_STATUS" = "pending-install" ] || [ "$RELEASE_STATUS" = "pending-upgrade" ]; then
              echo "Cleaning up previous $RELEASE_STATUS release..."
              helm uninstall remedai-api --namespace remedai --wait || true
            fi
          fi

          # Ensure namespace exists and is not stuck in terminating
          WAIT_COUNT=0
          while kubectl get ns remedai 2>/dev/null | grep -q "Terminating"; do
            echo "Waiting for terminating namespace remedai to finalize ($WAIT_COUNT/10)..."
            sleep 3
            WAIT_COUNT=$((WAIT_COUNT + 1))
            if [ $WAIT_COUNT -ge 10 ]; then
              echo "Force-releasing namespace finalizers..."
              kubectl get ns remedai -o json 2>/dev/null | jq '.spec.finalizers = []' | kubectl replace --raw "/api/v1/namespaces/remedai/finalize" -f - 2>/dev/null || true
              break
            fi
          done
          kubectl get ns remedai >/dev/null 2>&1 || kubectl create namespace remedai

          helm upgrade --install remedai-api "$CHART_PATH" \
            -f app-config.yaml \
            --namespace remedai \
            --set global.image="$IMAGE_URI" \
            --set app.image="$IMAGE_URI"

          echo "Verifying workload rollout status in namespace remedai..."
          kubectl rollout status deployment/remedai-bff -n remedai --timeout=180s || {
            echo "Deployment remedai-bff failed or timed out. Pod diagnostics:"
            kubectl get pods -n remedai
            kubectl describe pods -n remedai
            kubectl logs -n remedai -l app=remedai-bff --tail=100
            exit 1
          }
          kubectl rollout status deployment/remedai-scheduler -n remedai --timeout=180s || {
            echo "Deployment remedai-scheduler failed or timed out. Pod diagnostics:"
            kubectl get pods -n remedai
            kubectl describe pods -n remedai
            kubectl logs -n remedai -l app=remedai-scheduler --tail=100
            exit 1
          }
          echo "Current deployment and autoscaling status:"
          kubectl get pods,svc,scaledobject,scaledjob -n remedai

      # Optional step to update central S3 deployment manifest
      - name: Update Central S3 Deployment Manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
            ENV_NAME="${{ github.event.inputs.environment || 'dev' }}"
            STATE_BUCKET="remedai-terraform-state-${ACCOUNT_ID}"

            # Discover external IP / hostname of remedai service
            SVC_IP=$(kubectl get svc remedai-bff -n remedai -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
            SVC_HOST=$(kubectl get svc remedai-bff -n remedai -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            
            if [ -n "$SVC_IP" ]; then
              API_ENDPOINT="http://${SVC_IP}:8000"
            elif [ -n "$SVC_HOST" ]; then
              API_ENDPOINT="http://${SVC_HOST}:8000"
            else
              API_ENDPOINT="https://dev-api-gw.gateway.dev"
            fi

            echo "Saving active API Gateway endpoint $API_ENDPOINT to s3://${STATE_BUCKET}/config/${ENV_NAME}/manifest.json"
            if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
              aws s3 cp "s3://${STATE_BUCKET}/config/${ENV_NAME}/manifest.json" /tmp/manifest.json 2>/dev/null || echo "{}" > /tmp/manifest.json
              jq --arg ep "$API_ENDPOINT" --arg ts "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
                '.GCP_API_GATEWAY_URL = $ep | .BACKEND_DEPLOYED_TIMESTAMP = $ts' /tmp/manifest.json > /tmp/manifest_updated.json
              aws s3 cp /tmp/manifest_updated.json "s3://${STATE_BUCKET}/config/${ENV_NAME}/manifest.json"
            fi
          else
            echo "AWS credentials not provided in GKE runner; skipping S3 manifest sync."
          fi
