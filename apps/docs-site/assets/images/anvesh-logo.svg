<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="logo-shield-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="logo-glow-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="txt-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(6, 6)">
    <!-- Hexagonal Aegis Shield Container -->
    <polygon points="26,2 48,13 48,39 26,50 4,39 4,13" fill="url(#logo-shield-2)" />
    
    <!-- Inner Dark Glass Inset -->
    <polygon points="26,5 45,15 45,37 26,47 7,37 7,15" fill="#0B0F19" fill-opacity="0.9" stroke="url(#logo-glow-2)" stroke-width="1.2" stroke-linejoin="round" />

    <!-- T-bar -->
    <path d="M14 16 H38" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />
    
    <!-- Vertical T-stem & R spine -->
    <path d="M26 16 V37" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />
    
    <!-- R Loop & Lightning Remediation Leg -->
    <path d="M26 16 H33 C36.5 16 37.5 18.5 37.5 21.5 C37.5 24.5 35.5 27 31.5 27 H26 M30 27 L37 37" stroke="url(#logo-glow-2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Agentic Quantum Core Spark (Left Node) -->
    <circle cx="16" cy="27" r="2.6" fill="#10B981" />
    <circle cx="16" cy="27" r="1.2" fill="#FFFFFF" />

    <!-- Graph Connector Arc -->
    <path d="M16 27 Q 21 34 26 37" stroke="#10B981" stroke-width="1.4" stroke-dasharray="1.5 1.5" fill="none" />
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(66, 0)">
    <!-- Brand Name -->
    <text x="0" y="34" font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.6px">Tharior</text>
    <text x="82" y="34" font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="url(#txt-grad-2)" letter-spacing="-0.6px">Remedai</text>

    <!-- Subtitle Pill / Badge -->
    <rect x="0" y="42" width="168" height="14" rx="4" fill="#4F46E5" fill-opacity="0.12" />
    <text x="6" y="52.5" font-family="'JetBrains Mono', 'Inter', monospace" font-size="8.5" font-weight="700" fill="#6366F1" letter-spacing="0.8px">AGENTIC REMEDIATION</text>
  </g>
</svg>
