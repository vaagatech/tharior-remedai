<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="fav-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Aegis Shield Container -->
  <polygon points="32,3 58,16 58,48 32,61 6,48 6,16" fill="url(#fav-grad)" rx="6" />
  
  <!-- Inner Dark Glass Inset -->
  <polygon points="32,7 54,18 54,46 32,57 10,46 10,18" fill="#0B0F19" fill-opacity="0.88" stroke="url(#fav-glow)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Tharior Remedai Agentic Monogram: Intersecting 'T' Bar + 'R' Loop & Self-Healing Spark -->
  <path d="M18 20 H46" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M32 20 V46" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
  <path d="M32 20 H40 C44.5 20 45.5 23 45.5 26.5 C45.5 30 43.5 33 39 33 H32 M37 33 L45 46" stroke="url(#fav-glow)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Agentic Quantum Core Spark (Left Node) -->
  <circle cx="21" cy="33" r="3.2" fill="#10B981" />
  <circle cx="21" cy="33" r="1.5" fill="#FFFFFF" />

  <!-- Graph Connector Arc -->
  <path d="M21 33 Q 26 42 32 46" stroke="#10B981" stroke-width="1.8" stroke-dasharray="2 2" fill="none" />
</svg>